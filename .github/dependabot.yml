# Dependency updates: weekly, grouped, one PR per ecosystem. Security updates
# arrive as soon as an advisory is published regardless of the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors are reviewed by hand; they show up as separate PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      base-images:
        patterns: ["*"]
