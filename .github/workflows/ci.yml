name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: living-resume:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --rm --name resume -p 3000:3000 living-resume:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/ready; then ok=1; break; fi; sleep 1
          done
          [ "${ok:-}" = 1 ] || { docker logs resume; exit 1; }
          curl -fsS http://127.0.0.1:3000/ | grep -q "<h1"
          curl -fsS http://127.0.0.1:3000/api/resume | grep -q '"basics"'
          docker stop resume
