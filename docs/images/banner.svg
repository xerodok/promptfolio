<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Promptfolio — a resume that boots to a terminal">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.35" stop-color="#ff3d81"/>
      <stop offset="0.65" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c131b" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0c131b" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0c131b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0c131b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="#0c131b"/>
    <rect x="-100" y="-40" width="1480" height="200" fill="url(#aurora)" transform="skewX(-12)"/>
    <polygon points="-50,250 1330,150 1330,330 -50,330" fill="url(#band)" opacity="0.8"/>
    <rect width="1280" height="320" fill="url(#fade)"/>
    <!-- terminal window -->
    <g transform="translate(812,56)">
      <rect width="420" height="196" rx="10" fill="#0e151d" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="420" height="34" rx="10" fill="#000" fill-opacity="0.3"/>
      <rect y="24" width="420" height="10" fill="#000" fill-opacity="0.3"/>
      <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="38" cy="17" r="5" fill="#febc2e"/><circle cx="56" cy="17" r="5" fill="#28c840"/>
      <text x="84" y="22" font-family="'Source Code Pro','SFMono-Regular',Consolas,monospace" font-size="12" fill="#e9eef3">1 you@resume</text>
      <text x="196" y="22" font-family="'Source Code Pro','SFMono-Regular',Consolas,monospace" font-size="12" fill="#8696a7">2 Settings</text>
      <g font-family="'Source Code Pro','SFMono-Regular',Consolas,monospace" font-size="13">
        <rect x="16" y="50" width="86" height="18" rx="2" fill="#1f3a4d"/><text x="21" y="63" fill="#22d3ee">you@resume</text>
        <rect x="102" y="50" width="18" height="18" fill="#3b8ff2"/><text x="106" y="63" fill="#fff">~</text>
        <text x="124" y="63" fill="#3b8ff2">▶</text><text x="140" y="63" fill="#e9eef3">whoami</text>
        <text x="16" y="86" fill="#22d3ee">Chris Russell</text>
        <text x="16" y="106" fill="#ccd6df">Enterprise Platform &amp; Infrastructure Leader</text>
        <rect x="16" y="122" width="86" height="18" rx="2" fill="#1f3a4d"/><text x="21" y="135" fill="#22d3ee">you@resume</text>
        <rect x="102" y="122" width="18" height="18" fill="#3b8ff2"/><text x="106" y="135" fill="#fff">~</text>
        <text x="124" y="135" fill="#3b8ff2">▶</text><text x="140" y="135" fill="#e9eef3">ls</text>
        <text x="16" y="158" fill="#ccd6df">experience/  skills/  projects/  about.txt</text>
        <rect x="16" y="172" width="86" height="18" rx="2" fill="#1f3a4d"/><text x="21" y="185" fill="#22d3ee">you@resume</text>
        <rect x="102" y="172" width="18" height="18" fill="#3b8ff2"/><text x="106" y="185" fill="#fff">~</text>
        <text x="124" y="185" fill="#3b8ff2">▶</text><rect x="141" y="174" width="8" height="15" fill="#ff7a1a"/>
      </g>
    </g>
    <!-- wordmark -->
    <text x="64" y="128" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-weight="200" font-size="84" letter-spacing="-2" fill="#e9eef3">Promptfolio</text>
    <text x="68" y="174" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-weight="300" font-size="28" fill="#ccd6df">A resume that boots to a terminal.</text>
    <text x="68" y="214" font-family="'Source Code Pro','SFMono-Regular',Consolas,monospace" font-size="14" fill="#a9b6c3">JSON Resume in · site, print view, JSON API, probes out</text>
    <text x="68" y="236" font-family="'Source Code Pro','SFMono-Regular',Consolas,monospace" font-size="14" fill="#a9b6c3">one 257 MB container, or 1 MB of static files</text>
  </g>
</svg>
