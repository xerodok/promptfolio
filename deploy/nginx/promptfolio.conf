# nginx in front of Promptfolio. Install to /etc/nginx/sites-enabled/, set
# server_name, then `certbot --nginx -d resume.example.com` adds TLS and the
# HTTP -> HTTPS redirect. See docs/deploy/docker.md / systemd.md.
server {
    listen 80;
    listen [::]:80;
    server_name resume.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # After certbot: uncomment to send HSTS.
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
}
