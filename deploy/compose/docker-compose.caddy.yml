# Overlay: add Caddy with automatic TLS in front of the `web` service.
#   DOMAIN=resume.example.com ACME_EMAIL=you@example.com \
#     docker compose -f docker-compose.yml -f deploy/compose/docker-compose.caddy.yml up -d
# Ports 80/443 must reach this host and DOMAIN must resolve to it.
services:
  web:
    ports: !override [] # only Caddy is exposed
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      UPSTREAM: web:3000
      ACME_AGREE: "true"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
volumes:
  caddy_data:
  caddy_config:
